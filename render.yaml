services:
  - type: web
    name: bellyup
    runtime: python
    plan: free
    rootDir: bellyup
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
    autoDeployTrigger: commit
